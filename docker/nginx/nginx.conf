events {
    worker_connections 1024;
}

http {
    # Impostazioni log
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Timeout e buffer
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Header comuni verso i microservizi
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # DNS resolver Docker interno — risoluzione lazy degli upstream
    resolver 127.0.0.11 valid=10s ipv6=off;

    # CORS — gestito a livello gateway per tutti i servizi
    map $request_method $cors_method {
        OPTIONS 1;
        default 0;
    }

    server {
        listen 80;
        server_name _;

        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        # ------------------------------------------------------------------
        # API GATEWAY — routing path-based verso i microservizi
        # ------------------------------------------------------------------

        # AUTH SERVICE
        location /api/auth {
            proxy_pass http://auth-service:3001;
        }

        # TENANT SERVICE
        location /api/tenants {
            proxy_pass http://tenant-service:3002;
        }

        location /api/plans {
            proxy_pass http://tenant-service:3002;
        }

        # COMPANY SERVICE
        location /api/companies {
            proxy_pass http://company-service:3003;
        }

        # ASSIGNMENT SERVICE
        location /api/assignments {
            proxy_pass http://assignment-service:3004;
        }

        location /api/quarters {
            proxy_pass http://assignment-service:3004;
        }

        # AUDIT SERVICE
        location /api/audit {
            proxy_pass http://audit-service:3005;
        }

        # DOCUMENT SERVICE
        location /api/documents {
            proxy_pass http://document-service:3006;
        }

        location /api/drafts {
            proxy_pass http://document-service:3006;
        }

        # ACCOUNTING SERVICE
        location /api/accounting {
            proxy_pass http://accounting-service:3007;
        }

        # ai-service NON esposto via gateway — solo uso interno tra servizi

        # Catch-all / Preflight CORS + frontend
        location / {
            # Preflight CORS
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-Token" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }

            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;

            # Supporto WebSocket per HMR (Next.js dev mode)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
