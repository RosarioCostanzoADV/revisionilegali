events {
    worker_connections 1024;
}

http {
    # Impostazioni log
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Timeout e buffer
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Header comuni verso i microservizi
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;

        # ------------------------------------------------------------------
        # API GATEWAY — routing path-based verso i microservizi
        # ------------------------------------------------------------------

        # AUTH SERVICE
        location /api/auth/ {
            proxy_pass http://auth-service:3001;
        }

        # TENANT SERVICE
        location /api/tenants/ {
            proxy_pass http://tenant-service:3002;
        }

        location /api/plans/ {
            proxy_pass http://tenant-service:3002;
        }

        # COMPANY SERVICE
        location /api/companies/ {
            proxy_pass http://company-service:3003;
        }

        # ASSIGNMENT SERVICE
        location /api/assignments/ {
            proxy_pass http://assignment-service:3004;
        }

        # AUDIT SERVICE
        location /api/audit/ {
            proxy_pass http://audit-service:3005;
        }

        # DOCUMENT SERVICE
        location /api/documents/ {
            proxy_pass http://document-service:3006;
        }

        location /api/drafts/ {
            proxy_pass http://document-service:3006;
        }

        # ACCOUNTING SERVICE
        location /api/accounting/ {
            proxy_pass http://accounting-service:3007;
        }

        # ai-service NON esposto via gateway — solo uso interno tra servizi

        # ------------------------------------------------------------------
        # FRONTEND — tutto il resto va a Next.js
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://frontend:3000;

            # Supporto WebSocket per HMR (Next.js dev mode)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
